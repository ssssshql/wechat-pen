# Services
#   wechat-proxy  — fixed-egress open-platform agent
#   wechat-pen    — full editor + Chromium (QR login / CDP)
#
#   cp .env.example .env
#   docker compose up -d --build
#
# UI:    http://localhost:8080
# Proxy: http://localhost:8090
# Whitelist the proxy host public IP once in WeChat open platform.

services:
  wechat-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: wechat-pen-proxy:latest
    container_name: wechat-pen-proxy
    restart: unless-stopped
    ports:
      - "${WECHAT_PROXY_PORT:-8090}:8090"
    environment:
      WECHAT_PROXY_API_KEY: ${WECHAT_PROXY_API_KEY:?set WECHAT_PROXY_API_KEY in .env}
      WECHAT_PEN_APPID: ${WECHAT_PEN_APPID:?set WECHAT_PEN_APPID in .env}
      WECHAT_PEN_SECRET: ${WECHAT_PEN_SECRET:?set WECHAT_PEN_SECRET in .env}

